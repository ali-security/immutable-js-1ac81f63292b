name: Build

on:
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  build:
    name: 'Build dist, run tests, pack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # immutable 3.x carries a 2016-era toolchain (grunt 0.4.5 / gulp 3.9 /
      # jest-cli 0.5.10). Node 6 is the only runtime that toolchain supports:
      # Node 4 and older lack ES6 spread in jest-cli's own sources, Node 0.10/0.12
      # lack a global Promise, and Node 8+ removed Promise.defer which
      # jest-cli 0.5's JasmineReporter depends on.
      - uses: actions/setup-node@v4
        with:
          node-version: '6'

      - name: Install dev dependencies
        run: npm install --ignore-scripts --no-optional

      - name: Build dist from src
        run: |
          ./node_modules/.bin/grunt build
          ./node_modules/.bin/gulp typedefs

      - name: Report dist drift vs the committed dist
        run: git diff --stat -- dist

      - name: Run test suite (jest)
        run: ./node_modules/.bin/jest

      # The published tarball uses npm's reproducible tar layout (fixed
      # 1985-10-26 mtimes), which npm 3 (bundled with Node 6) does not produce.
      # Node 22 ships npm 10.9.x, which reproduces it byte for byte.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pack
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: immutable-3.8.3.tgz
          if-no-files-found: error
